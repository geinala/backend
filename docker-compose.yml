version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: solver-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - REDIS_LOGLEVEL=notice

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solver-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RQ_QUEUE=default
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: rq worker -v
    networks:
      - solver-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  solver-network:
    driver: bridge
